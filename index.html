<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ankit Soni — Product &amp; UX Designer</title>
  <meta name="description" content="Ankit Soni — Product and UX designer.">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #090909;
      color: #f5f5f5;
      font-family: Inter, ui-sans-serif, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.55;
    }

    a {
      color: inherit;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .container {
      width: min(100% - 32px, 760px);
      margin: auto;
    }

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #1f1f1f;
      position: sticky;
      top: 0;
      background: rgba(9, 9, 9, .88);
      backdrop-filter: blur(14px);
      z-index: 20;
    }

    .topbar .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-weight: 650;
      text-decoration: none;
      font-size: 14px;
    }

    .nav {
      display: flex;
      gap: 18px;
    }

    .nav a {
      text-decoration: none;
      color: #8d8d8d;
      font-size: 13px;
    }

    .nav a:hover {
      color: #fff;
    }

    .hero {
      padding: 64px 0 48px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 82px 1fr;
      gap: 22px;
      align-items: start;
    }

    .avatar {
      width: 82px;
      height: 82px;
      border-radius: 16px;
      background: #171717;
      border: 1px solid #282828;
      display: block;
      object-fit: cover;
      object-position: 50% 34%;
    }

    h1, h2, h3, p {
      margin: 0;
    }

    h1 {
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: -.035em;
      font-weight: 650;
    }

    .role {
      color: #aaa;
      margin-top: 3px;
      font-size: 14px;
    }

    .available {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #aaa;
      margin-top: 12px;
      font-size: 12px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #58d68d;
      box-shadow: 0 0 0 3px rgba(88, 214, 141, .08);
    }

    .bio {
      margin-top: 20px;
      color: #b2b2b2;
      max-width: 650px;
    }

    .bio strong {
      color: #e8e8e8;
      font-weight: 500;
    }

    .actions {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .btn {
      border: 1px solid #292929;
      background: #141414;
      padding: 8px 11px;
      border-radius: 7px;
      text-decoration: none;
      color: #d7d7d7;
      font-size: 12px;
    }

    .btn:hover {
      border-color: #414141;
      background: #181818;
    }

    .section {
      padding: 44px 0;
      border-top: 1px solid #1c1c1c;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      margin-bottom: 22px;
    }

    .section-head h2 {
      font-size: 18px;
      letter-spacing: -.025em;
      font-weight: 620;
    }

    .section-head p {
      font-size: 12px;
      color: #747474;
      margin-top: 4px;
    }
