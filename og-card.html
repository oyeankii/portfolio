<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG Image — Ankit Soni</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#e8e6d7;--accent:#d8ff70}
*{box-sizing:border-box;margin:0}
html,body{background:#000}
/* Fixed 1200x630 canvas (standard OG size) */
.og{position:relative;width:1200px;height:630px;overflow:hidden;background:#090909;color:var(--cream);font-family:Inter,ui-sans-serif,-apple-system,"Segoe UI",sans-serif;isolation:isolate}
.glow{position:absolute;inset:0;z-index:-3;background:radial-gradient(520px 380px at 78% 0%,rgba(52,68,36,.95),transparent 70%),radial-gradient(480px 380px at 6% 100%,rgba(30,38,24,.9),transparent 70%)}
.noise{position:absolute;inset:0;z-index:-2;opacity:.22;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")}
.top{position:absolute;top:50px;left:64px;right:64px;display:flex;justify-content:space-between;font-size:15px;letter-spacing:.15em;font-weight:500}
.top span{display:flex;align-items:center;gap:12px}
.top i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 16px rgba(216,255,112,.45)}
.over{position:absolute;left:64px;top:292px;font-size:16px;letter-spacing:.2em;font-weight:500;color:rgba(232,230,215,.72)}
h1{position:absolute;left:54px;top:300px;font-size:290px;line-height:1;letter-spacing:-.105em;font-weight:600;white-space:nowrap}
h1 b{position:absolute;top:34px;right:-62px;font-size:56px;font-weight:400;letter-spacing:0;color:var(--accent)}
.copy{position:absolute;left:720px;bottom:46px;width:420px}
.copy p{font-size:23px;line-height:1.43;color:rgba(255,255,245,.88);margin-bottom:24px}
.cta{display:inline-flex;align-items:center;gap:60px;border-radius:999px;padding:7px 8px 7px 26px;background:var(--accent);color:#10110b;font-size:17px;font-weight:650}
.cta span{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#11120e;color:var(--cream);font-size:18px}
</style>
</head>
<body>
<div class="og" id="og">
  <div class="glow"></div><div class="noise"></div>
  <div class="top"><span><i></i>AVAILABLE FOR WORK</span><span>INDIA · WORKING WORLDWIDE</span></div>
  <p class="over">PRODUCT DESIGN · DESIGN SYSTEMS · AI</p>
  <h1>Ankit<b>✳</b></h1>
  <div class="copy">
    <p>Product &amp; UX Designer building thoughtful products, scalable design systems and AI experiences.</p>
    <div class="cta">Explore my work <span>↗</span></div>
  </div>
</div>
</body>
</html>
